name: Build and attach .exe to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза"
        required: true
        default: "v1.0.0"
  push:
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          mkdir -p out
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o out/DesktopSorter.exe .
          GOOS=windows GOARCH=386   CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o out/DesktopSorter-32bit.exe .
          cd out && sha256sum *.exe > SHA256SUMS.txt
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG=v1.0.0
          gh release upload "$TAG" out/DesktopSorter.exe out/DesktopSorter-32bit.exe out/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
